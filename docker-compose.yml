version: '3.8'

services:
  web-estudiantes:
    image: nodensx/jenkins:latest
    ports:
      - "5002:5000"  # <--- CAMBIA ESTO (Antes tenías 80:5000)
    networks:
      - red-bd-swarm
    environment:
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - red-bd-swarm
    deploy:
      replicas: 1
      placement:
        constraints:
          # La App corre en el manager para gestionar el stack
          - node.role == manager

networks:
  red-bd-swarm:
    external: true