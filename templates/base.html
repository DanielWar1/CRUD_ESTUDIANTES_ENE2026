<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW0Hq0WQYkN4MEnsyV4A7zK0uXDd2uV0QX5fVxv0Q9A/Q==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <title>{% block title %}{% endblock %}</title>
    <style>
        :root {
            --tecnm-green: #0a8754;
            --tecnm-orange: #ff8a00;
            --tecnm-blue: #0077b6;
            --surface: #fffef8;
        }

        body {
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
            background:
                radial-gradient(circle at 10% 15%, rgba(255, 200, 87, 0.32), transparent 25%),
                radial-gradient(circle at 85% 20%, rgba(0, 119, 182, 0.2), transparent 30%),
                linear-gradient(130deg, #f8fff8 0%, #eef8ff 50%, #fffaf0 100%);
        }

        .page-shell {
            max-width: 1050px;
            margin: 2rem auto;
            background-color: var(--surface);
            border-radius: 20px;
            box-shadow: 0 18px 40px rgba(13, 42, 62, 0.12);
            overflow: hidden;
        }

        .hero-banner {
            background: linear-gradient(115deg, var(--tecnm-green), var(--tecnm-blue));
            color: #fff;
            padding: 2rem;
        }

        .hero-banner .title {
            font-weight: 900;
            letter-spacing: 0.4px;
            margin-bottom: 0.35rem;
        }

        .hero-banner .subtitle {
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 0;
        }

        .content-area {
            padding: 1.75rem;
        }

        .is-brand {
            background-color: var(--tecnm-orange);
            color: #fff;
            border-color: transparent;
        }

        .is-brand:hover {
            color: #fff;
            filter: brightness(0.95);
        }

        .fade-up {
            opacity: 0;
            transform: translateY(12px);
            animation: fadeUp 0.55s ease forwards;
        }

        .stagger-1 { animation-delay: 0.08s; }
        .stagger-2 { animation-delay: 0.16s; }
        .stagger-3 { animation-delay: 0.24s; }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .fade-up {
                animation: none;
                opacity: 1;
                transform: none;
            }
        }

        @media (max-width: 768px) {
            .hero-banner {
                padding: 1.35rem;
            }

            .content-area {
                padding: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <section class="section pt-5">
        <div class="page-shell">
            <header class="hero-banner fade-up">
                <h1 class="title is-2"><i class="fa-solid fa-graduation-cap mr-2"></i> Pagina TecNM</h1>
                <p class="subtitle is-5"><i class="fa-solid fa-id-card mr-2"></i> Registro de Estudiantes</p>
            </header>
            <main class="content-area">
            {% block content %}{% endblock %}
            </main>
        </div>
    </section>
</body>
</html>
