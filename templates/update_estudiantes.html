{% extends 'base.html' %}
{% block title %}Actualizar Estudiante{% endblock %}
{% block content %}
<div class="columns is-centered">
    <div class="column is-8-tablet is-6-desktop fade-up stagger-2">
        <div class="box">
                <h3 class="title is-4 mb-4"><i class="fa-solid fa-user-pen mr-2"></i> Actualizar estudiante</h3>
                <form action="{{ url_for('update_estudiante', no_control=estudiante.no_control) }}" method="POST">
                    <div class="field">
                        <label class="label" for="no_control">No. Control</label>
                        <div class="control">
                            <input class="input" type="text" id="no_control" name="no_control" value="{{ estudiante.no_control }}" disabled>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label" for="nombre">Nombre</label>
                        <div class="control">
                            <input class="input" type="text" id="nombre" name="nombre" value="{{ estudiante.nombre }}" required>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label" for="ap_paterno">Apellido paterno</label>
                        <div class="control">
                            <input class="input" type="text" id="ap_paterno" name="ap_paterno" value="{{ estudiante.ap_paterno }}" required>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label" for="ap_materno">Apellido materno</label>
                        <div class="control">
                            <input class="input" type="text" id="ap_materno" name="ap_materno" value="{{ estudiante.ap_materno }}" required>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label" for="semestre">Semestre</label>
                        <div class="control">
                            <input class="input" type="number" id="semestre" name="semestre" value="{{ estudiante.semestre }}" min="1" required>
                        </div>
                    </div>

                    <div class="buttons mt-5">
                        <button type="submit" class="button is-brand">
                            <span class="icon"><i class="fa-solid fa-rotate"></i></span>
                            <span>Actualizar</span>
                        </button>
                        <a href="{{ url_for('index') }}" class="button is-light">
                            <span class="icon"><i class="fa-solid fa-ban"></i></span>
                            <span>Cancelar</span>
                        </a>
                    </div>
                </form>
        </div>
    </div>
</div>
{% endblock %}
